# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: s99wjw5d7n-byte/CONVIVIVIALITE
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c0de6207-fefa-4247-912b-4a1e2c08f1ad/pkce
  auth_token_endpoint: /sites/c0de6207-fefa-4247-912b-4a1e2c08f1ad/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Affiche un bouton "Voir le site" dans l'interface d'administration
site_url: https://hypervoisins-convivialite.netlify.app
display_url: https://hypervoisins-convivialite.netlify.app

# Les images uploadées via le CMS iront ici
media_folder: "src/assets/images"
public_folder: "/src/assets/images"

publish_mode: simple
locale: fr

collections:
  - name: "content"
    label: "Contenu du site"
    files:
      - name: "content"
        label: "Toutes les pages"
        file: "src/content.json"
        fields:
          - label: "Informations générales du site"
            name: "site"
            widget: object
            fields:
              - { label: "Titre du site", name: title, widget: string }
              - { label: "Description (SEO)", name: description, widget: text }
              - { label: "Auteur", name: author, widget: string }

          - label: "Page d'accueil"
            name: "home"
            widget: object
            fields:
              - label: "Section principale (Hero)"
                name: hero
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Sous-titre", name: subtitle, widget: text }
                  - { label: "Texte du bouton", name: buttonText, widget: string }
                  - { label: "Image de fond (nom de fichier)", name: backgroundImage, widget: string }
              - label: "Introduction"
                name: introduction
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Texte", name: content, widget: text }
                  - { label: "Citation", name: quote, widget: text }
                  - { label: "Auteur de la citation", name: quoteAuthor, widget: string }
                  - { label: "Texte du lien", name: linkText, widget: string }
              - label: "Cartes de section"
                name: sections
                widget: object
                fields:
                  - { label: "Titre de la section", name: title, widget: string }
                  - label: "Cartes"
                    name: cards
                    widget: list
                    fields:
                      - { label: "Icône (nom Lucide)", name: icon, widget: string }
                      - { label: "Couleur de l'icône", name: iconColor, widget: color }
                      - { label: "Titre", name: title, widget: string }
                      - { label: "Texte", name: content, widget: text }
                      - { label: "Texte du lien", name: linkText, widget: string }
                      - { label: "URL du lien", name: linkUrl, widget: string }
              - label: "Témoignages"
                name: testimonials
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - label: "Liste des témoignages"
                    name: items
                    widget: list
                    fields:
                      - { label: "Citation", name: quote, widget: text }
                      - { label: "Auteur", name: author, widget: string }
              - label: "Appel à l'action"
                name: callToAction
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Texte", name: content, widget: text }
                  - { label: "Texte du bouton", name: buttonText, widget: string }
                  - { label: "URL du bouton", name: buttonUrl, widget: string }

          - label: "Page Définition"
            name: "definition"
            widget: object
            fields:
              - label: "Section principale"
                name: hero
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Sous-titre", name: subtitle, widget: text }
              - label: "1.1 La convivialité selon Ivan Illich"
                name: illich
                widget: object
                fields:
                  - { label: "Titre de la sous-section", name: title, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - { label: "Citation", name: quote, widget: text }
                  - { label: "Auteur de la citation", name: quoteAuthor, widget: string }
                  - { label: "Phrase avant la liste", name: listIntro, widget: string }
                  - label: "Liste à puces"
                    name: list
                    widget: list
                    field: { label: "Élément", name: item, widget: string }
                  - { label: "Texte de conclusion", name: conclusion, widget: text }
              - label: "1.2 La convivialité appliquée au milieu urbain"
                name: urbain
                widget: object
                fields:
                  - { label: "Titre de la sous-section", name: title, widget: string }
                  - { label: "Image (nom de fichier)", name: image, widget: string }
                  - { label: "Légende de l'image", name: imageCaption, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - { label: "Citation", name: quote, widget: text }
                  - { label: "Auteur de la citation", name: quoteAuthor, widget: string }
                  - { label: "Texte de conclusion", name: conclusion, widget: text }
              - label: "Caractéristiques d'une ville conviviale"
                name: caracteristiques
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - label: "Cartes"
                    name: cards
                    widget: list
                    fields:
                      - { label: "Titre", name: title, widget: string }
                      - { label: "Texte", name: content, widget: text }
                  - { label: "Texte de conclusion", name: conclusion, widget: text }

          - label: "Page Pourquoi une politique publique"
            name: "whyPolicy"
            widget: object
            fields:
              - label: "Section principale"
                name: hero
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Sous-titre", name: subtitle, widget: text }
              - label: "2.1 Les enjeux contemporains des villes"
                name: enjeux
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - label: "Cartes (défis)"
                    name: cards
                    widget: list
                    fields:
                      - { label: "Titre", name: title, widget: string }
                      - { label: "Texte", name: content, widget: text }
                  - { label: "Texte de conclusion", name: conclusion, widget: text }
              - label: "2.2 Les bénéfices d'une politique de convivialité"
                name: benefices
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - label: "Lignes du tableau"
                    name: items
                    widget: list
                    fields:
                      - { label: "Bénéfice", name: title, widget: string }
                      - { label: "Description", name: content, widget: text }
                  - { label: "Texte de conclusion", name: conclusion, widget: text }

          - label: "Page Mesures concrètes"
            name: "measures"
            widget: object
            fields:
              - label: "Section principale"
                name: hero
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Sous-titre", name: subtitle, widget: text }
              - label: "3.1 Aménagement des espaces publics"
                name: espaces
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Image (nom de fichier)", name: image, widget: string }
                  - { label: "Sous-titre 1 (Rues conviviales)", name: subtitle1, widget: string }
                  - { label: "Texte d'introduction 1", name: intro1, widget: text }
                  - { label: "Phrase avant les axes", name: listIntro1, widget: string }
                  - label: "Les 3 axes"
                    name: axes
                    widget: list
                    fields:
                      - { label: "Nom de l'axe", name: label, widget: string }
                      - { label: "Description", name: content, widget: text }
                  - { label: "Texte d'introduction 2", name: intro2, widget: text }
                  - { label: "Sous-titre 2 (Places publiques)", name: subtitle2, widget: string }
                  - { label: "Texte d'introduction 3", name: intro3, widget: text }
                  - label: "Liste (places publiques)"
                    name: list2
                    widget: list
                    field: { label: "Élément", name: item, widget: string }
              - label: "3.2 Développement des tiers-lieux"
                name: tiersLieux
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Image 1 (nom de fichier)", name: image1, widget: string }
                  - { label: "Image 2 (nom de fichier)", name: image2, widget: string }
                  - { label: "Texte d'introduction", name: intro1, widget: text }
                  - { label: "Phrase avant la liste", name: listIntro, widget: string }
                  - label: "Liste (caractéristiques)"
                    name: list
                    widget: list
                    field: { label: "Élément", name: item, widget: string }
                  - { label: "Texte de conclusion", name: conclusion, widget: text }
              - label: "3.3 Gouvernance participative"
                name: gouvernance
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Image (nom de fichier)", name: image, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - label: "Cartes (mesures de gouvernance)"
                    name: cards
                    widget: list
                    fields:
                      - { label: "Titre", name: title, widget: string }
                      - { label: "Texte", name: content, widget: text }
                      - { label: "Exemple", name: example, widget: string }
              - label: "3.4 Animation de l'espace public"
                name: animation
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - label: "Types d'animation"
                    name: items
                    widget: list
                    fields:
                      - { label: "Titre", name: title, widget: string }
                      - { label: "Texte", name: content, widget: text }
              - label: "3.5 Soutien à l'économie de la convivialité"
                name: economie
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Texte d'introduction", name: intro, widget: text }
                  - { label: "Titre de l'encadré", name: cardTitle, widget: string }
                  - label: "Acteurs"
                    name: items
                    widget: list
                    fields:
                      - { label: "Nom de l'acteur", name: label, widget: string }
                      - { label: "Description", name: content, widget: text }
                  - { label: "Texte de conclusion", name: conclusion, widget: text }

          - label: "Page Mise en œuvre"
            name: "implementation"
            widget: object
            fields:
              - label: "Section principale"
                name: hero
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Sous-titre", name: subtitle, widget: text }

          - label: "Page Exemples"
            name: "examples"
            widget: object
            fields:
              - label: "Section principale"
                name: hero
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Sous-titre", name: subtitle, widget: text }

          - label: "Page Contact"
            name: "contact"
            widget: object
            fields:
              - label: "Section principale"
                name: hero
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Sous-titre", name: subtitle, widget: text }
              - label: "Formulaire"
                name: form
                widget: object
                fields:
                  - { label: "Placeholder nom", name: namePlaceholder, widget: string }
                  - { label: "Placeholder email", name: emailPlaceholder, widget: string }
                  - { label: "Placeholder sujet", name: subjectPlaceholder, widget: string }
                  - { label: "Placeholder message", name: messagePlaceholder, widget: string }
                  - { label: "Texte du bouton", name: buttonText, widget: string }
              - label: "Coordonnées"
                name: info
                widget: object
                fields:
                  - { label: "Titre", name: title, widget: string }
                  - { label: "Email", name: email, widget: string }
                  - { label: "Téléphone", name: phone, widget: string }
                  - { label: "Adresse", name: address, widget: string }

          - label: "Pied de page"
            name: "footer"
            widget: object
            fields:
              - { label: "À propos", name: about, widget: text }
              - { label: "Copyright", name: copyright, widget: string }

          - label: "Navigation"
            name: "navigation"
            widget: object
            fields:
